[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpilot-strategies"
version = "0.1.0"
description = "GridPilot strategy pack: forecast-driven and risk-aware BESS dispatch (paper trading only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DataWithSyed" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "gridpilot-core>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "gridpilot-data>=0.1.0", "gridpilot-risk>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
