[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpilot"
version = "0.4.0"
description = "Paper-trading energy-market agent: forecast, risk, strategies, backtest, live pilot, dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DataWithSyed" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.28"]
dev = ["pytest>=7.0", "streamlit>=1.28"]
entsoe = ["entsoe-py>=0.6"]

[project.scripts]
gridpilot-backtest = "gridpilot_backtest.cli:main"
gridpilot-live-pilot = "gridpilot_live.cli:main"

[tool.setuptools.packages.find]
where = [
  "packages/core/src",
  "packages/data/src",
  "packages/risk/src",
  "packages/strategies/src",
  "packages/forecast/src",
  "packages/backtest/src",
  "packages/live/src",
  "packages/dashboard/src",
]

[tool.pytest.ini_options]
testpaths = [
  "packages/core/tests",
  "packages/data/tests",
  "packages/risk/tests",
  "packages/strategies/tests",
  "packages/forecast/tests",
  "packages/backtest/tests",
  "packages/live/tests",
  "packages/dashboard/tests",
]
pythonpath = [
  "packages/core/src",
  "packages/data/src",
  "packages/risk/src",
  "packages/strategies/src",
  "packages/forecast/src",
  "packages/backtest/src",
  "packages/live/src",
  "packages/dashboard/src",
]
