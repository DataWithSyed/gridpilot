[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpilot-dashboard"
version = "0.1.0"
description = "GridPilot Streamlit ops view (paper trading). Logic in a testable package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DataWithSyed" }]
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
ui = ["streamlit>=1.28", "matplotlib>=3.7"]
dev = ["pytest>=7.0", "streamlit>=1.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
